# The Lamp Slack app. At api.slack.com/apps choose Create New App, then From a manifest, pick the
# Lamp workspace and paste this. Steps: docs/slack.md.
display_information:
  name: Lamp
  description: Lamp's deal alerts, each rep's leads, and /lamp lookups.
  background_color: "#0f1f17"
features:
  bot_user:
    display_name: Lamp
    always_online: true
  slash_commands:
    - command: /lamp
      url: https://getlamp.app/api/slack/command
      description: Your leads and files in Lamp
      usage_hint: "today | lead <name or phone> | help"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:write
      - users:read
      - users:read.email
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
